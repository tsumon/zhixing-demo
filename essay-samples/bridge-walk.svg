<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1050" viewBox="0 0 820 1050"><title>走过河上的老桥 · 合成示例原稿</title><rect width="820" height="1050" fill="#eee9df"/><rect x="20" y="18" width="780" height="1014" rx="3" fill="#fffdf5" stroke="#d8d1bf"/><text x="56" y="74" font-family="sans-serif" font-size="19" fill="#817b70">语文 · 秋季叙事习作</text><text x="764" y="74" text-anchor="end" font-family="sans-serif" font-size="16" fill="#817b70">合成示例原稿 · 1 / 1</text><path d="M56 98H764" stroke="#b6aba0"/><text x="410" y="163" text-anchor="middle" font-family="Kaiti SC,STKaiti,serif" font-size="33" fill="#293844">走过河上的老桥</text><g stroke="#e8cbc7" stroke-width="1"><path d="M56 245H764"/><path d="M56 285H764"/><path d="M56 325H764"/><path d="M56 365H764"/><path d="M56 405H764"/><path d="M56 445H764"/><path d="M56 485H764"/><path d="M56 525H764"/><path d="M56 565H764"/><path d="M56 605H764"/><path d="M56 645H764"/><path d="M56 685H764"/><path d="M56 725H764"/><path d="M56 765H764"/><path d="M56 805H764"/><path d="M56 845H764"/><path d="M56 885H764"/></g><g font-family="Kaiti SC,STKaiti,serif" font-size="25" fill="#354555"><text x="67" y="235">　　周末，外婆带我去河对岸买菜。旧石桥只容两个人并肩</text><text x="67" y="275">走，桥面被来往的脚步磨得发亮。</text><text x="67" y="315">　　走到桥中央，我想停下来拍照，后面有人推着一辆装满</text><text x="67" y="355">青菜的车。我侧身让路，外婆轻轻拉住我，让我站到石栏里</text><text x="67" y="395">面。</text><text x="67" y="435">　　卖菜的爷爷走过去时向我们点头。外婆说，她小时候每</text><text x="67" y="475">天都从这里上学，那时桥下还有摆渡的小船。</text><text x="67" y="515">　　回程时，我没有再急着拍照，而是慢慢听外婆讲那些与</text><text x="67" y="555">桥有关的人。照片能留下样子，同行的人却让我看见了桥的</text><text x="67" y="595">另一面。</text></g><text x="56" y="984" font-family="sans-serif" font-size="16" fill="#91877b">教学演示样本 · 请对照原稿核对文字与标点</text></svg>