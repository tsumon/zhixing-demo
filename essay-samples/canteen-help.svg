<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1050" viewBox="0 0 820 1050"><title>食堂门口的托盘 · 合成示例原稿</title><rect width="820" height="1050" fill="#eee9df"/><rect x="20" y="18" width="780" height="1014" rx="3" fill="#fffdf5" stroke="#d8d1bf"/><text x="56" y="74" font-family="sans-serif" font-size="19" fill="#817b70">语文 · 秋季叙事习作</text><text x="764" y="74" text-anchor="end" font-family="sans-serif" font-size="16" fill="#817b70">合成示例原稿 · 1 / 1</text><path d="M56 98H764" stroke="#b6aba0"/><text x="410" y="163" text-anchor="middle" font-family="Kaiti SC,STKaiti,serif" font-size="33" fill="#293844">食堂门口的托盘</text><g stroke="#e8cbc7" stroke-width="1"><path d="M56 245H764"/><path d="M56 285H764"/><path d="M56 325H764"/><path d="M56 365H764"/><path d="M56 405H764"/><path d="M56 445H764"/><path d="M56 485H764"/><path d="M56 525H764"/><path d="M56 565H764"/><path d="M56 605H764"/><path d="M56 645H764"/><path d="M56 685H764"/><path d="M56 725H764"/><path d="M56 765H764"/><path d="M56 805H764"/><path d="M56 845H764"/><path d="M56 885H764"/></g><g font-family="Kaiti SC,STKaiti,serif" font-size="25" fill="#354555"><text x="67" y="235">　　中午下课，我端着托盘走到食堂门口，前面的低年级同</text><text x="67" y="275">学忽然停住了脚步。他的汤洒在地上，鞋尖也湿了一片。</text><text x="67" y="315">　　后面的队伍越来越长，他低着头不敢说话。我把自己的</text><text x="67" y="355">托盘放到旁边，先请后面的同学从另一边绕过去。</text><text x="67" y="395">　　值日老师拿来拖把，我陪着他重新盛了一碗汤。他小声</text><text x="67" y="435">说谢谢，仍然担心自己的饭凉了。</text><text x="67" y="475">　　我们找了靠窗的位置坐下。我发现，帮助别人有时不需</text><text x="67" y="515">要讲很多道理，先把眼前的小麻烦一起处理好就够了。</text></g><text x="56" y="984" font-family="sans-serif" font-size="16" fill="#91877b">教学演示样本 · 请对照原稿核对文字与标点</text></svg>