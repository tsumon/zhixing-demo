<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1050" viewBox="0 0 820 1050"><title>菜园里的第一片新叶 · 合成示例原稿</title><rect width="820" height="1050" fill="#eee9df"/><rect x="20" y="18" width="780" height="1014" rx="3" fill="#fffdf5" stroke="#d8d1bf"/><text x="56" y="74" font-family="sans-serif" font-size="19" fill="#817b70">语文 · 秋季叙事习作</text><text x="764" y="74" text-anchor="end" font-family="sans-serif" font-size="16" fill="#817b70">合成示例原稿 · 1 / 1</text><path d="M56 98H764" stroke="#b6aba0"/><text x="410" y="163" text-anchor="middle" font-family="Kaiti SC,STKaiti,serif" font-size="33" fill="#293844">菜园里的第一片新叶</text><g stroke="#e8cbc7" stroke-width="1"><path d="M56 245H764"/><path d="M56 285H764"/><path d="M56 325H764"/><path d="M56 365H764"/><path d="M56 405H764"/><path d="M56 445H764"/><path d="M56 485H764"/><path d="M56 525H764"/><path d="M56 565H764"/><path d="M56 605H764"/><path d="M56 645H764"/><path d="M56 685H764"/><path d="M56 725H764"/><path d="M56 765H764"/><path d="M56 805H764"/><path d="M56 845H764"/><path d="M56 885H764"/></g><g font-family="Kaiti SC,STKaiti,serif" font-size="25" fill="#354555"><text x="67" y="235">　　周一，我把一粒豆子埋进花盆，每天放学先去看看它。</text><text x="67" y="275">三天过去，土面还是原来的样子，我忍不住用手指拨开泥土。</text><text x="67" y="315">　　爸爸拦住我，说种子需要安静。我把花盆搬到窗边，在</text><text x="67" y="355">本子上记下浇水的时间，决定再等几天。</text><text x="67" y="395">　　周五清晨，泥土裂开了一条细缝，一弯淡绿的芽顶着土</text><text x="67" y="435">粒探出头来。它比我想象的小，却让我趴在窗台看了很久。</text><text x="67" y="475">　　后来我明白，观察不只是盼着结果，还要记住那些暂时</text><text x="67" y="515">看不出变化的日子。</text></g><text x="56" y="984" font-family="sans-serif" font-size="16" fill="#91877b">教学演示样本 · 请对照原稿核对文字与标点</text></svg>