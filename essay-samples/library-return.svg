<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1050" viewBox="0 0 820 1050"><title>最后一本归还的书 · 合成示例原稿</title><rect width="820" height="1050" fill="#eee9df"/><rect x="20" y="18" width="780" height="1014" rx="3" fill="#fffdf5" stroke="#d8d1bf"/><text x="56" y="74" font-family="sans-serif" font-size="19" fill="#817b70">语文 · 秋季叙事习作</text><text x="764" y="74" text-anchor="end" font-family="sans-serif" font-size="16" fill="#817b70">合成示例原稿 · 1 / 1</text><path d="M56 98H764" stroke="#b6aba0"/><text x="410" y="163" text-anchor="middle" font-family="Kaiti SC,STKaiti,serif" font-size="33" fill="#293844">最后一本归还的书</text><g stroke="#e8cbc7" stroke-width="1"><path d="M56 245H764"/><path d="M56 285H764"/><path d="M56 325H764"/><path d="M56 365H764"/><path d="M56 405H764"/><path d="M56 445H764"/><path d="M56 485H764"/><path d="M56 525H764"/><path d="M56 565H764"/><path d="M56 605H764"/><path d="M56 645H764"/><path d="M56 685H764"/><path d="M56 725H764"/><path d="M56 765H764"/><path d="M56 805H764"/><path d="M56 845H764"/><path d="M56 885H764"/></g><g font-family="Kaiti SC,STKaiti,serif" font-size="25" fill="#354555"><text x="67" y="235">　　午休的图书角快关门了，我发现书包里还有一本该归还</text><text x="67" y="275">的书。封面右下角被我不小心折出了白痕。</text><text x="67" y="315">　　我在门口站了一会儿，想把书悄悄塞回书架。值日同学</text><text x="67" y="355">抬头看见我，问我是不是找不到借阅登记表。</text><text x="67" y="395">　　我把书递给她，指着折角说了经过。她拿出修补纸，让</text><text x="67" y="435">我先把翘起的边压平，再一起贴好。</text><text x="67" y="475">　　在登记表上写完名字，我才发现承认一件小错并没有想</text><text x="67" y="515">象中困难。那本书留下一道细细的补痕，也提醒我下次更仔</text><text x="67" y="555">细地对待借来的东西。</text></g><text x="56" y="984" font-family="sans-serif" font-size="16" fill="#91877b">教学演示样本 · 请对照原稿核对文字与标点</text></svg>