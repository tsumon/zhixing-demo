<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1050" viewBox="0 0 820 1050"><title>雨中的一件小事 · 学生习作示例原稿</title><defs><filter id="blur"><feGaussianBlur stdDeviation="0"/></filter></defs><rect width="820" height="1050" fill="#eee9df"/><rect x="20" y="18" width="780" height="1014" rx="3" fill="#fffdf5" stroke="#d8d1bf"/><text x="56" y="74" font-family="sans-serif" font-size="19" fill="#817b70">语文 · 第六单元习作</text><text x="764" y="74" text-anchor="end" font-family="sans-serif" font-size="16" fill="#817b70">示例原稿 · 1 / 1</text><path d="M56 98H764" stroke="#b6aba0"/><g filter="url(#blur)"><text x="410" y="163" text-anchor="middle" font-family="Kaiti SC,STKaiti,serif" font-size="33" fill="#293844">雨中的一件小事</text><g stroke="#e8cbc7" stroke-width="1"><path d="M56 280H764"/><path d="M56 334H764"/><path d="M56 388H764"/><path d="M56 442H764"/><path d="M56 496H764"/><path d="M56 550H764"/><path d="M56 604H764"/><path d="M56 658H764"/><path d="M56 712H764"/><path d="M56 766H764"/><path d="M56 820H764"/><path d="M56 874H764"/></g><g font-family="Kaiti SC,STKaiti,serif" font-size="26" fill="#354555"><text x="76" y="265">放学后，教室窗外忽然下起了雨，我忘了带伞。</text><text x="76" y="319">同桌小雨把书包放好，说我们一起走吧。</text><text x="76" y="373">走到校门口，我发现她的右肩已经湿了，伞却一直偏向我</text><text x="76" y="427">。</text><text x="76" y="481">我把伞往她那边推了推，两个人笑着踩过浅浅的水洼。</text><text x="76" y="535">那天我明白，帮助别人不一定要做很大的事，也可以是雨</text><text x="76" y="589">里让出的一点位置。</text></g></g><text x="56" y="984" font-family="sans-serif" font-size="16" fill="#91877b">请对照原稿检查识别后的文字与标点</text></svg>